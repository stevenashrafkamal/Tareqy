<div class="auth-page">
  <div class="auth-left">
    <div class="auth-brand">
      <span class="brand-text">Tareqy</span>
      <span class="brand-dot"></span>
    </div>
    <h2>Welcome back, explorer</h2>
    <p>Your islands are waiting. Continue your coding adventure.</p>
    <div class="island-preview">
      <div class="preview-island done">
        <span>🌱</span>
        <small>Basics</small>
      </div>
      <div class="preview-path"></div>
      <div class="preview-island active">
        <span>⚡</span>
        <small>Beginner</small>
      </div>
      <div class="preview-path"></div>
      <div class="preview-island locked">
        <span>🔒</span>
        <small>Pro</small>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="auth-sub">Enter your details to continue</p>



      @if (errorMsg()) {
        <div class="error-msg">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ errorMsg() }}
        </div>
      }

      <form (ngSubmit)="onLogin()">
        <div class="field">
          <label>Email address</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" autocomplete="email">
        </div>

        <div class="field">
          <label>
            Password
            <a routerLink="/auth/forgot" class="forgot-link">Forgot password?</a>
          </label>
          <div class="pw-wrap">
            <input [type]="showPw() ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="eye-btn" (click)="showPw.set(!showPw())">
              @if (showPw()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary submit-btn" [disabled]="loading()">
          @if (loading()) {
            <svg class="spin" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity=".3"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
          }
          {{ loading() ? 'Logging in...' : 'Log in' }}
        </button>
      </form>

      <p class="auth-switch">Don't have an account? <a routerLink="/auth/register">Sign up free</a></p>
    </div>
  </div>
</div>
